<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Reistadlia Vel logo">
  <title>Reistadlia Vel</title>
  <desc>Profesjonalisert logo for Reistadlia Vel med blått treikon, sort navnetrekk og grå tagline.</desc>
  <defs>
    <linearGradient id="treeBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#20AEEF"/>
      <stop offset="100%" stop-color="#0B8FE8"/>
    </linearGradient>
    <style>
      .wordmark {
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 800;
        letter-spacing: 0.055em;
      }
      .tagline {
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 500;
        letter-spacing: 0.34em;
      }
    </style>
  </defs>

  <!-- Transparent background -->

  <!-- Icon -->
  <g transform="translate(145 148)" fill="none" stroke="url(#treeBlue)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tree canopy: clean, balanced and compact for mobile header use -->
    <path d="M -40 92
             C -86 82 -115 54 -116 18
             C -139 1 -139 -38 -113 -58
             C -104 -99 -67 -126 -26 -124
             C -3 -164 50 -178 91 -151
             C 126 -151 157 -128 170 -94
             C 206 -77 225 -41 215 -3
             C 240 31 234 84 199 113
             C 172 135 131 143 86 139"/>

    <!-- Trunk -->
    <path d="M 20 -28 L 20 152"/>

    <!-- Branches -->
    <path d="M -44 22
             C -25 54 -6 70 20 70
             C 45 70 66 55 84 29"/>
    <path d="M 20 70 C 35 62 48 50 60 36"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(300 105)">
    <text class="wordmark" x="0" y="68" font-size="82" fill="#111827">REISTADLIA VEL</text>
    <text class="tagline" x="4" y="128" font-size="28" fill="#7A7F87">AKTIV, TRIVELIG, TRYGG</text>
  </g>
</svg>
